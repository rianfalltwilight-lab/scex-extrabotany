plugins {
    id "java"
    id "maven-publish"
    id "net.neoforged.moddev" version "2.0.141"
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = "https://maven.blamejared.com" }
    exclusiveContent {
        forRepository { maven { url = "https://maven.theillusivec4.top/" } }
        filter { includeGroup("top.theillusivec4.curios") }
    }
    maven { url = "https://maven.terraformersmc.com/releases" }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup("maven.modrinth") }
    }
    maven { url = "https://maven.latvian.dev/releases" }
    maven { url = "https://maven.saps.dev/minecraft" }
    maven { url = "https://maven.architectury.dev" }
}

// Layout:
//   src/main       the mod (this is the only content of the release JAR)
//   src/generated  the output of the data generators ("gradlew runData")
//   src/datagen    the data generators (never in the release JAR)
//   src/gametest   the game tests and their structures (never in the release JAR)
sourceSets {
    main {
        resources.srcDir "src/generated/resources"
    }
    datagen {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    datagenImplementation.extendsFrom implementation
    datagenCompileOnly.extendsFrom compileOnly
    datagenRuntimeOnly.extendsFrom runtimeOnly
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

// The usual run has the tests of the mod. "-Pgametest_namespaces=extrabotany_perf" runs the performance scenarios in place of them.
def gameTestNamespaces = providers.gradleProperty("gametest_namespaces").getOrElse(mod_id)

neoForge {
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.datagen)
    addModdingDependenciesTo(sourceSets.gametest)

    mods {
        // The mod as players get it.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        // The mod together with its data generators. Only the data run loads this group.
        "${mod_id}_datagen" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.datagen)
        }
        // The mod together with its game tests. Only the test runs load this group.
        "${mod_id}_gametest" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        configureEach {
            systemProperty "neoforge.logging.console.level", "debug"
            gameDirectory = file("run")
        }
        client {
            client()
            loadedMods = [mods."${mod_id}"]
        }
        server {
            server()
            programArgument "--nogui"
            loadedMods = [mods."${mod_id}"]
        }
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            loadedMods = [mods."${mod_id}_gametest"]
            systemProperty "neoforge.enabledGameTestNamespaces", gameTestNamespaces
        }
        // A client that also has the test classes. The client probes in src/gametest need it.
        gameTestClient {
            client()
            sourceSet = sourceSets.gametest
            loadedMods = [mods."${mod_id}_gametest"]
            systemProperty "neoforge.enabledGameTestNamespaces", gameTestNamespaces
        }
        data {
            data()
            sourceSet = sourceSets.datagen
            loadedMods = [mods."${mod_id}_datagen"]
            // The generators do not write a file that has a hand-written version in this directory (see HandWrittenFilter).
            systemProperty "extrabotany.datagen.handwritten", file("src/main/resources").absolutePath
            programArguments.addAll "--mod", mod_id, "--all",
                    "--output", file("src/generated/resources").absolutePath,
                    "--existing", file("src/main/resources").absolutePath,
                    "--existing-mod", "botania"
        }
    }
}

dependencies {
    implementation("vazkii.botania:botania-neoforge-${minecraft_version}:${botania_version}")
    implementation("vazkii.patchouli:Patchouli:${patchouli_version}-NEOFORGE")

    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")

    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    // The creator Maven currently redirects to an intermittently unavailable host.
    // Modrinth version IDs are immutable and keep this fallback reproducible.
    compileOnly("maven.modrinth:fRiHVvU7:${emi_modrinth_version}")
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")

    compileOnly("com.demonwav.mcdev:annotations:2.1.0")
    compileOnly("org.jetbrains:annotations:24.1.0")
    compileOnly("com.google.code.findbugs:jsr305:3.0.2")

    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// Pin resolved transitive inputs as well as the direct versions above.
dependencyLocking {
    // Maven reports this timestamped artifact as 456-SNAPSHOT in its metadata.
    // A generated SNAPSHOT lock conflicts with the exact timestamp coordinate.
    ignoredDependencies.add("vazkii.botania:botania-neoforge-${minecraft_version}")
}
configurations.configureEach {
    if (name in ["compileClasspath", "runtimeClasspath", "testCompileClasspath", "testRuntimeClasspath"]) {
        resolutionStrategy.activateDependencyLocking()
    }
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version,
            neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_logo: mod_logo,
            mod_credits: mod_credits,
            botania_version_range: botania_version_range,
            patchouli_version_range: patchouli_version_range,
            curios_version_range: curios_version_range,
            jei_version_range: jei_version_range,
            kubejs_version_range: kubejs_version_range
    ]
    inputs.properties(replaceProperties)
    expand(replaceProperties)
    from("src/main/templates")
    into(layout.buildDirectory.dir("generated/sources/modMetadata"))
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs.addAll(["-Xlint:deprecation", "-Xmaxerrs", "2000", "-Xmaxwarns", "500"])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    includeEmptyDirs = false
    exclude ".cache"
}

tasks.withType(Jar).configureEach {
    from("LICENSE", "LICENSE-MIT", "NOTICE")
    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named("jar", Jar).configure {
    manifest {
        attributes([
                "Specification-Title": artifact_name,
                "Specification-Vendor": "ExtraMeteorP / Lounode",
                "Specification-Version": "1",
                "Implementation-Title": artifact_name,
                "Implementation-Version": archiveVersion.get(),
                "Implementation-Vendor": "Magellan67"
        ])
    }
}

// Opt-in validation artifact with the game tests; never distribute it to players.
tasks.register("validationJar", Jar) {
    archiveClassifier = "validation"
    from sourceSets.main.output
    from sourceSets.gametest.output
    manifest.from(tasks.named("jar", Jar).get().manifest)
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
