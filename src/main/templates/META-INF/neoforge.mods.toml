modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Rianfalltwilight-lab/scex-extrabotany/issues"

[[mixins]]
config="extrabotany_xplat.mixins.json"

[[mixins]]
config="extrabotany_neoforge.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Rianfalltwilight-lab/scex-extrabotany"
logoFile="${mod_logo}"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="botania"
type="required"
versionRange="${botania_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="patchouli"
type="required"
versionRange="${patchouli_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="curios"
type="required"
versionRange="${curios_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="jei"
type="optional"
versionRange="${jei_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="kubejs"
type="optional"
versionRange="${kubejs_version_range}"
ordering="NONE"
side="BOTH"

# The SCEX Forest Wand compat bridge is merged into this JAR from 2.0-scex.10 on.
# Loading both would register the wand HEAD injector twice.
[[dependencies."${mod_id}"]]
modId="scex_botania_extrabotany_compat"
type="incompatible"
reason="Merged into ExtraBotany from 2.0-scex.10 on; remove SCEX-Botania-ExtraBotany-Compat from the mods folder."
versionRange="[0,)"
ordering="NONE"
side="BOTH"
