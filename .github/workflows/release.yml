name: Publish prerelease

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Resolve release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Manual runs must target an existing release tag." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          test -f "${notes}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "NOTES=${notes}" >> "${GITHUB_ENV}"
      - name: Audit public source
        shell: pwsh
        run: ./scripts/verify-public-source.ps1
      - name: Build
        run: ./gradlew --no-daemon --no-configuration-cache build
      - name: Run NeoForge GameTests
        run: ./gradlew --no-daemon --no-configuration-cache runGameTestServer
      - name: Prepare deterministic release bundle
        shell: pwsh
        run: ./scripts/prepare-release.ps1 -Destination build/public-release -ExpectedTag "${env:GITHUB_REF_NAME}"
      - name: Preserve release bundle as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: extrabotany-${{ env.VERSION }}-release
          path: build/public-release/*
          if-no-files-found: error
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="ExtraBotany 1.21.1 ${VERSION} — SCEX AI-assisted preview"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" build/public-release/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --prerelease --title "${title}" --notes-file "${NOTES}"
          else
            gh release create "${GITHUB_REF_NAME}" build/public-release/* --prerelease --title "${title}" --notes-file "${NOTES}"
          fi
