name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Audit public source
        shell: pwsh
        run: ./scripts/verify-public-source.ps1
      - name: Build
        run: ./gradlew --no-daemon --no-configuration-cache build
      - name: Run NeoForge GameTests
        run: ./gradlew --no-daemon --no-configuration-cache runGameTestServer
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: extrabotany-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
