name: Java CI

on:
  push:
    branches: [main, scex-1.21.1]
  pull_request:
    branches: [main, scex-1.21.1]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and compile validation sources
        run: ./gradlew.bat --no-daemon --no-configuration-cache build compileGametestJava compileDatagenJava
      - name: Run NeoForge GameTests
        run: ./gradlew.bat --no-daemon --no-configuration-cache runGameTestServer
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: extrabotany-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
